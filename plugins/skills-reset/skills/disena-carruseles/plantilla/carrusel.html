<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Tu carrusel</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;600;800;900&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;700&family=Archivo+Black&family=Montserrat:ital,wght@0,400;0,800;1,400&family=Cormorant+Garamond:ital,wght@1,500&family=Poppins:wght@400;700;900&family=Dancing+Script:wght@600&family=Oswald:wght@500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* ===== el visor ===== */
*{margin:0;padding:0;box-sizing:border-box}
body.visor{background:#ECE8E2;font-family:'DM Sans',Arial,sans-serif;color:#1b1b1b;padding:24px 16px 80px}
.cab{max-width:1100px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.cab h1{font-size:22px}
.cab p{font-size:14px;opacity:.7;max-width:640px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;background:#1b1b1b;color:#fff}
.btn.sec{background:#fff;color:#1b1b1b;border:1px solid #ccc}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px}
.item{background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.marco{width:100%;aspect-ratio:1080/1350;overflow:hidden;border-radius:8px;position:relative}
.marco .slide{transform-origin:0 0;position:absolute;left:0;top:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tools .num{font-weight:700;font-size:14px;margin-right:auto}
.tools button,.tools label{font-size:12px;border:1px solid #ddd;background:#fafafa;border-radius:999px;padding:6px 10px;cursor:pointer}
.tools input{display:none}
.panel{max-width:1100px;margin:0 auto 20px;background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.panel .g{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.panel .g>b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-right:2px}
.panel select{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid #ccc;background:#fafafa;max-width:170px}
.panel input[type=color]{width:34px;height:30px;border:1px solid #ccc;border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.panel label{display:flex;flex-direction:column;align-items:center;font-size:11px;opacity:.85}
.panel .mini{font-size:12px;border:1px solid #ccc;background:#fafafa;border-radius:999px;padding:6px 12px;cursor:pointer}
body.editando .slide [contenteditable]{outline:2px dashed rgba(0,120,255,.55);outline-offset:4px}
.cap{max-width:1100px;margin:26px auto 0;background:#fff;border-radius:16px;padding:18px;white-space:pre-wrap;font-size:14px;line-height:1.5}
.nota{max-width:1100px;margin:10px auto 0;font-size:13px;opacity:.7}
.ver{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;padding:20px}
.ver img{max-height:80vh;max-width:92vw;border-radius:8px;background:#fff}
.ver p{color:#fff;font-size:15px;text-align:center}

/* ===== la slide (1080x1350) ===== */
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--fondo);color:var(--tinta);font-family:var(--f-cuerpo)}
.slide [contenteditable]{outline:none}
.slide [contenteditable]:focus{box-shadow:0 0 0 3px rgba(0,120,255,.35)}
.ph{position:absolute;background-size:cover;background-position:center;background-color:rgba(0,0,0,.08)}
.ph.vacia{display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.35);font-size:34px;font-family:'DM Sans',sans-serif;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.04) 0 20px,transparent 20px 40px)}
.vel{position:absolute;inset:0}
.tx{position:absolute;left:80px;right:80px}
.eti{font-size:26px;letter-spacing:.24em;font-weight:700;text-transform:uppercase}
.tit{font-family:var(--f-titulo);line-height:1.02;padding-top:.05em}
.tit .k{font-family:var(--f-serif);font-style:italic;color:var(--acento);text-transform:none;font-weight:400}
.apo{font-size:36px;line-height:1.42;margin-top:36px;max-width:860px}
.mano{font-family:var(--f-mano);font-weight:700}
.firma{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:22px;letter-spacing:.22em;opacity:.6;text-transform:uppercase}
.lst{margin-top:40px}
.lst div{background:var(--tarjeta);color:var(--tinta);border-radius:22px;padding:34px 38px;margin-bottom:24px;font-size:46px;font-weight:700;display:flex;gap:22px;align-items:center}
.lst div b{font-family:var(--f-mano);color:var(--acento);font-size:60px;line-height:.8}
.cmp{display:flex;gap:28px;margin-top:44px}
.cmp>div{flex:1;border-radius:24px;padding:40px 36px;font-size:40px;line-height:1.45;min-height:620px;background:var(--tarjeta);color:var(--tinta)}
.cmp>div:nth-child(2){background:var(--tinta);color:var(--fondo)}
.cmp h4{font-size:24px;letter-spacing:.2em;margin-bottom:18px;color:var(--acento)}
.chat{margin-top:44px;background:var(--tarjeta);border-radius:26px;padding:40px 36px}
.chat p{border-radius:24px;padding:22px 30px;font-size:40px;margin:22px 0;max-width:80%;background:rgba(0,0,0,.06);color:var(--tinta)}
.chat p.yo{margin-left:auto;background:var(--tinta);color:var(--fondo)}
.palabra{display:inline-block;background:var(--acento);color:#fff;padding:6px 40px 18px;margin-top:18px}
.palabra span{font-family:var(--f-serif);font-style:italic;font-size:150px;line-height:1}

/* posiciones del texto (se cambian con el botón para no tapar la cara) */
.pos-arriba .tx{top:130px}
.pos-abajo .tx{bottom:130px}
.pos-centro .tx{top:50%;transform:translateY(-50%)}

/* ===== 1 · editorial con foto ===== */
.st-editorial .ph{top:0;right:0;width:46%;height:100%}
.st-editorial.sinfoto .tx,.st-editorial .tx{right:46%;padding-right:40px}
.st-editorial.sinfoto .tx{right:80px}
.st-editorial .tit{font-size:150px;text-transform:uppercase}
.st-editorial.r-cierre .ph{width:100%;height:46%;top:auto;bottom:0}
.st-editorial.r-cierre .tx{right:80px;text-align:center;top:110px;bottom:auto;transform:none}
/* ===== 2 · portada de revista ===== */
.st-revista{color:#fff}
.st-revista .ph{inset:0}
.st-revista .vel{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.08) 40%,rgba(0,0,0,.65))}
.st-revista:not(.r-portada) .vel{background:rgba(10,6,6,.6)}
.st-revista .tit{font-size:150px;text-transform:uppercase}
.st-revista.r-portada .tit{font-size:210px;text-align:center;line-height:.92}
.st-revista.r-portada .tx{left:30px;right:30px;text-align:center}
.st-revista .tit .k{display:inline-block;background:var(--acento);color:#fff;padding:0 22px 10px;transform:rotate(-3deg);font-size:.42em}
.st-revista .apo{text-transform:uppercase;letter-spacing:.12em;font-size:30px;font-weight:700}
.st-revista .firma{opacity:.8}
/* ===== 3 · guía tipo cuaderno ===== */
.st-cuaderno{background-color:var(--fondo);background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:54px 54px}
.st-cuaderno .tit{font-family:var(--f-cuerpo);font-weight:900;letter-spacing:-.04em;font-size:124px;line-height:1}
.st-cuaderno .eti{font-family:var(--f-mano);text-transform:none;letter-spacing:0;font-size:52px;color:var(--acento)}
.st-cuaderno .ph{width:440px;height:520px;right:110px;bottom:120px;border:14px solid #fff;border-bottom-width:56px;box-shadow:0 14px 30px rgba(0,0,0,.16);transform:rotate(3deg)}
/* ===== 4 · foto oscura con una palabra en color ===== */
.st-oscura{color:#fff;background:#111}
.st-oscura .ph{inset:0}
.st-oscura .vel{background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.8) 75%)}
.st-oscura.pos-arriba .vel{background:linear-gradient(0deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.8) 75%)}
.st-oscura .tit{font-family:var(--f-cuerpo);font-weight:900;letter-spacing:-.05em;font-size:120px;line-height:.95}
.st-oscura .tit .k{font-family:var(--f-cuerpo);font-style:normal;font-weight:900;color:var(--resalte)}
.st-oscura .apo{text-transform:uppercase;font-size:30px;letter-spacing:.06em;font-weight:600}
/* ===== 5 · collage juguetón ===== */
.st-collage{background:var(--suave)}
.st-collage .tit{font-family:var(--f-cuerpo);font-weight:900;letter-spacing:-.04em;font-size:130px;line-height:.95}
.st-collage .eti{font-family:var(--f-mano);text-transform:none;letter-spacing:0;font-size:52px;color:var(--acento)}
.st-collage .ph{width:420px;height:500px;right:90px;bottom:140px;border:14px solid #fff;border-bottom-width:56px;box-shadow:0 14px 30px rgba(0,0,0,.18);transform:rotate(5deg)}
.st-collage .ph::before{content:"";position:absolute;left:150px;top:-50px;width:100px;height:56px;border:9px solid #C9A227;border-bottom:none;border-radius:40px 40px 0 0}
.st-collage .deco{position:absolute;font-size:70px;color:var(--acento)}
/* ===== 6 · oferta o curso ===== */
.st-oferta .banda{position:absolute;left:0;right:0;top:0;height:58%;background:var(--acento)}
.st-oferta.r-portada .tx{color:#fff}
.st-oferta .tit{font-size:190px;text-transform:uppercase}
.st-oferta.r-portada .tit .k{color:#fff}
.st-oferta .ph{width:52%;height:84%;right:-20px;top:100px;background-size:contain;background-repeat:no-repeat;background-position:bottom center;background-color:transparent}
.st-oferta:not(.r-portada) .banda{display:none}
.st-oferta:not(.r-portada) .tit{font-size:120px}
.st-oferta .precio{margin-top:30px;background:var(--tinta);color:var(--fondo);border-radius:24px;padding:30px 40px;display:flex;justify-content:space-between;align-items:center}
.st-oferta .precio b{font-family:var(--f-titulo);font-size:120px;color:var(--resalte);font-weight:400}
/* ===== 7 · mi día tipo agenda ===== */
.st-agenda{color:#fff}
.st-agenda .ph{inset:0}
.st-agenda .vel{background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.2) 55%,rgba(0,0,0,.1))}
.st-agenda .eti{display:inline-block;border:3px solid var(--resalte);border-radius:999px;padding:4px 36px;font-family:var(--f-mano);text-transform:none;letter-spacing:0;font-size:58px;color:var(--resalte)}
.st-agenda .tx{text-align:center}
.st-agenda .tit{font-family:var(--f-serif);font-style:italic;font-weight:400;font-size:92px;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.st-agenda .tit .k{color:var(--resalte)}
.st-agenda .lst{background:#fff;border-radius:22px;padding:26px 30px;text-align:left}
.st-agenda .lst div{background:var(--fondo);font-size:30px;border-left:8px solid var(--acento);border-radius:12px;margin-bottom:12px;padding:16px 22px}
.st-agenda .lst div b{display:none}
/* ===== 8 · aesthetic de la vida real ===== */
.st-aesthetic{color:#fff}
.st-aesthetic .ph{inset:0}
.st-aesthetic .vel{background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 88%)}
.st-aesthetic.pos-arriba .vel{background:linear-gradient(0deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 88%)}
.st-aesthetic .tit{font-family:var(--f-cuerpo);font-weight:900;letter-spacing:-.05em;font-size:140px;line-height:.9;color:var(--resalte)}
.st-aesthetic .tit .k{font-family:var(--f-mano);font-style:normal;color:#fff;font-size:.6em;display:block}
.st-aesthetic .etqs span{display:inline-block;background:rgba(255,255,255,.92);color:#1b1b1b;border-radius:999px;padding:8px 22px;font-size:28px;font-weight:700;margin:0 10px 12px 0}

/* ===== otras formas: cambian cómo se organiza la slide, en cualquier estilo ===== */
/* portada */
.slide.r-portada.var-1 .ph{inset:0;width:100%;height:100%;transform:none;border:0;right:0;top:0}
.slide.r-portada.var-1 .vel{background:linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,0) 58%)}
.slide.r-portada.var-1 .tx{left:80px!important;right:80px!important;top:auto!important;bottom:130px!important;transform:none!important;color:#fff;text-align:left;padding:0!important}
.slide.r-portada.var-2 .ph{display:none}
.slide.r-portada.var-2 .tx{left:80px!important;right:80px!important;top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;text-align:center;padding:0!important}
.slide.r-portada.var-2 .tit{font-size:170px}
.slide.r-portada.var-3 .ph{inset:auto;left:270px;top:110px;width:540px;height:540px;border-radius:50%;transform:none;border:10px solid var(--tarjeta)}
.slide.r-portada.var-3 .tx{left:80px!important;right:80px!important;top:auto!important;bottom:120px!important;transform:none!important;text-align:center;padding:0!important}
.slide.r-portada.var-3 .tit{font-size:110px}
/* texto */
.slide.r-texto.var-1 .ph,.slide.r-texto.var-2 .ph{display:none}
.slide.r-texto.var-1 .tx,.slide.r-texto.var-2 .tx{left:90px!important;right:90px!important;top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;text-align:center;padding:0!important}
.slide.r-texto.var-1 .tit{font-size:180px;line-height:.95}
.slide.r-texto.var-2 .tit{font-family:var(--f-serif);font-style:italic;text-transform:none;font-size:96px;line-height:1.1;font-weight:400}
.slide.r-texto.var-2 .tit::before{content:"\201C";display:block;font-size:220px;line-height:.6;color:var(--acento)}
.slide.r-texto.var-3 .ph{inset:auto;right:70px;bottom:110px;left:auto;top:auto;width:430px;height:520px;border:14px solid #fff;border-bottom-width:56px;transform:rotate(3deg);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.slide.r-texto.var-3 .tx{left:80px!important;right:80px!important;top:120px!important;bottom:auto!important;transform:none!important;padding:0!important}
.slide.r-texto.var-3 .apo{font-family:var(--f-mano);font-size:56px;color:var(--acento);max-width:480px}
/* lista */
.slide.r-lista.var-1 .lst div{background:none;border-bottom:3px solid rgba(0,0,0,.12);border-radius:0;padding:26px 0;margin:0}
.slide.r-lista.var-1 .lst div b{font-size:0;width:64px;height:64px;flex:none;border-radius:50%;background:var(--acento);position:relative}
.slide.r-lista.var-1 .lst div b::after{content:"✓";font-size:40px;color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-cuerpo)}
.slide.r-lista.var-2 .lst div{background:none;padding:6px 0;margin-bottom:18px;font-size:52px}
.slide.r-lista.var-2 .lst div b{font-family:var(--f-titulo);font-size:150px;line-height:.9;min-width:120px}
.slide.r-lista.var-3 .lst{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.slide.r-lista.var-3 .lst div{flex-direction:column;align-items:flex-start;min-height:330px;margin:0;font-size:42px}
/* comparación */
.slide.r-comparacion.var-1 .cmp{flex-direction:column;gap:22px}
.slide.r-comparacion.var-1 .cmp>div{min-height:0}
.slide.r-comparacion.var-2 .cmp>div{background:none!important;color:var(--tinta)!important;border-radius:0;padding:26px 0 0;border-top:10px solid rgba(0,0,0,.25)}
.slide.r-comparacion.var-2 .cmp>div:nth-child(2){border-top-color:var(--acento)}
.slide.r-comparacion.var-2 .cmp>div:first-child h4::before{content:"✗  ";color:#9a9a9a}
.slide.r-comparacion.var-2 .cmp>div:nth-child(2) h4::before{content:"✓  "}
.slide.r-comparacion.var-3 .cmp{gap:90px;position:relative}
.slide.r-comparacion.var-3 .cmp::after{content:"→";position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:var(--acento);color:#fff;font-size:70px;display:flex;align-items:center;justify-content:center;font-family:var(--f-cuerpo)}
/* chat */
.slide.r-chat.var-1 .chat{width:640px;margin:36px auto 0;border:18px solid #141414;border-radius:72px;padding:70px 28px;min-height:880px}
/* oferta */
.slide.r-oferta.var-1 .precio{flex-direction:column;align-items:flex-start;background:none;color:var(--tinta);padding:0}
.slide.r-oferta.var-1 .precio b{font-size:250px;color:var(--acento)}
/* cierre */
.slide.r-cierre.var-1 .ph{display:none}
.slide.r-cierre.var-1 .tx{left:80px!important;right:80px!important;top:50%!important;bottom:auto!important;transform:translateY(-50%)!important;text-align:center;padding:0!important}
.slide.r-cierre.var-1 .palabra{background:none;padding:0}
.slide.r-cierre.var-1 .palabra span{font-size:230px;color:var(--acento)}
.slide.r-cierre.var-2 .ph{inset:0;width:100%;height:100%;transform:none;border:0;top:0;bottom:0}
.slide.r-cierre.var-2 .vel{background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0) 60%)}
.slide.r-cierre.var-2 .tx{left:80px!important;right:80px!important;top:auto!important;bottom:130px!important;transform:none!important;text-align:center;color:#fff;padding:0!important}
/* ===== cada estilo con su propio diseño (la forma "la del estilo" = var-0) ===== */
.mast,.n2,.vs,.antes{display:none}
.antes{font-size:60px;opacity:.55;margin-right:24px}
/* REVISTA: cabecera de revista, índice, entrevista, sticker de precio */
.st-revista .mast{display:flex;position:absolute;left:60px;right:60px;top:42px;justify-content:space-between;font-family:var(--f-cuerpo);font-weight:700;font-size:21px;letter-spacing:.3em;text-transform:uppercase;border-bottom:2px solid currentColor;padding-bottom:12px;z-index:3}
.st-revista.sinfoto,.st-revista.r-lista,.st-revista.r-oferta{color:var(--tinta)}
.st-revista.r-lista .ph,.st-revista.r-lista .vel,.st-revista.r-oferta .ph,.st-revista.r-oferta .vel,.st-revista.sinfoto .vel{display:none}
.st-revista.var-0.r-lista .tx,.st-revista.var-0.r-comparacion .tx,.st-revista.var-0.r-chat .tx,.st-revista.var-0.r-oferta .tx{top:150px;transform:none;bottom:auto}
.st-revista.var-0.r-lista .tit,.st-revista.var-0.r-comparacion .tit,.st-revista.var-0.r-chat .tit,.st-revista.var-0.r-oferta .tit{font-size:118px}
.st-revista.var-0 .lst div{background:none;border-radius:0;border-top:2px solid var(--tinta);padding:22px 0;margin:0;font-family:var(--f-cuerpo);font-weight:800;text-transform:uppercase;font-size:40px;letter-spacing:.02em;color:var(--tinta)}
.st-revista.var-0 .lst div:last-child{border-bottom:2px solid var(--tinta)}
.st-revista.var-0 .lst b{display:none}
.st-revista.var-0 .lst .n2{display:block;font-family:var(--f-serif);font-style:italic;font-size:92px;color:var(--acento);min-width:150px;line-height:1}
.st-revista.var-0 .cmp{position:relative;gap:150px}
.st-revista.var-0 .cmp>div{background:none!important;color:var(--tinta)!important;border-radius:0;padding:0;min-height:0}
.st-revista.var-0 .cmp h4{display:inline-block;background:var(--acento);color:#fff;padding:8px 18px;transform:rotate(-2deg);font-size:26px}
.st-revista.var-0 .vs{display:flex;position:absolute;left:50%;top:120px;width:110px;height:110px;margin-left:-55px;align-items:center;justify-content:center;font-family:var(--f-serif);font-style:italic;font-size:76px;color:var(--acento);border:2px solid var(--acento);border-radius:50%;background:var(--fondo)}
.st-revista.var-0 .chat{background:none;padding:0}
.st-revista.var-0 .chat p{background:none;max-width:none;padding:0;margin:30px 0;font-size:40px;color:var(--tinta);border-radius:0}
.st-revista.var-0 .chat p.yo{font-weight:800;margin-left:0}
.st-revista.var-0 .chat p.yo::before{content:"P. ";color:var(--acento)}
.st-revista.var-0 .chat p:not(.yo){font-family:var(--f-serif);font-style:italic;font-size:50px;line-height:1.2}

  v.querySelector("button").onclick = () => v.remove(); document.body.appendChild(v);
}
function guardar() { try { localStorage.setItem("carrusel-fotos", JSON.stringify(fotos)); } catch (e) {} }
try { Object.assign(fotos, JSON.parse(localStorage.getItem("carrusel-fotos") || "{}")); } catch (e) {}
/*FOTOS*/
/* ===== panel de ajustes: estilo, colores, letras, textos ===== */
const ESTILOS = {editorial: "Editorial con foto", revista: "Portada de revista", cuaderno: "Guía tipo cuaderno", oscura: "Foto oscura", collage: "Collage", oferta: "Oferta o curso", agenda: "Mi día (agenda)", aesthetic: "Aesthetic", escritorio: "Escritorio (ventanas)"};
const LETRAS = {titulo: ["Anton", "Bebas Neue", "Oswald", "Archivo Black", "Poppins", "Montserrat", "Playfair Display", "Inter Tight"],
  serif: ["Instrument Serif", "Playfair Display", "Cormorant Garamond", "Caveat", "Dancing Script"],
  cuerpo: ["Inter Tight", "DM Sans", "Montserrat", "Poppins"],
  mano: ["Caveat", "Dancing Script", "Instrument Serif"]};
const NOMBRES = {fondo: "Fondo", tinta: "Texto", acento: "Acento", resalte: "Resalte"};
const ORIG = JSON.parse(JSON.stringify(DATA));
try { const g = JSON.parse(localStorage.getItem("carrusel-ajustes") || "null"); if (g && g.n === DATA.slides.length) Object.assign(DATA, g.d); } catch (e) {}
function aplicarMarca() {
  for (const [k, v] of Object.entries(DATA.marca.colores)) root.setProperty("--" + k, v);
  root.setProperty('--resalte-claro', claro(DATA.marca.colores.resalte, .62));
  for (const [k, v] of Object.entries(DATA.marca.letras)) root.setProperty("--f-" + k, `'${v}',${FB[k]}`);
}
function guardarAjustes() { try { localStorage.setItem("carrusel-ajustes", JSON.stringify({n: DATA.slides.length, d: {estilo: DATA.estilo, marca: DATA.marca, slides: DATA.slides}})); } catch (e) {} }
function panel() {
  const P = document.getElementById("panel"), col = DATA.marca.colores, le = DATA.marca.letras;
  P.innerHTML = `<div class="g"><b>Estilo</b><select id="pe">${Object.entries(ESTILOS).map(([k, v]) => `<option value="${k}" ${k === DATA.estilo ? "selected" : ""}>${v}</option>`).join("")}</select></div>
  <div class="g"><b>Colores</b>${Object.keys(NOMBRES).map(k => `<label><input type="color" data-c="${k}" value="${col[k] || "#000000"}">${NOMBRES[k]}</label>`).join("")}
  <button class="mini" id="inv">⇄ Invertir</button><button class="mini" id="mez">🎲 Probar combinación</button><button class="mini" id="formas">🔀 Otras formas</button><button class="mini" id="propio">💡 Mi propio diseño</button></div>
  <div class="g"><b>Letras</b>${[["titulo", "Titular"], ["serif", "Palabra clave"], ["cuerpo", "Texto"], ["mano", "A mano"]].map(([k, n]) => `<label>${n}<select data-l="${k}">${[...new Set([le[k], ...LETRAS[k]])].map(f => `<option ${f === le[k] ? "selected" : ""}>${f}</option>`).join("")}</select></label>`).join("")}</div>
  <div class="g"><button class="mini" id="edt">✏️ Editar textos</button><button class="mini" id="cop">📋 Copiar mis ajustes</button><button class="mini" id="res">↺ Volver al original</button></div>`;
  P.querySelector("#pe").onchange = e => { DATA.estilo = e.target.value; DATA.slides.forEach(x => delete x.pos); guardarAjustes(); pintar(); };
  P.querySelectorAll("[data-c]").forEach(i => i.oninput = e => { col[e.target.dataset.c] = e.target.value; aplicarMarca(); guardarAjustes(); });
  P.querySelectorAll("[data-l]").forEach(i => i.onchange = e => { le[e.target.dataset.l] = e.target.value; aplicarMarca(); guardarAjustes(); });
  P.querySelector("#inv").onclick = () => { [col.fondo, col.tinta] = [col.tinta, col.fondo]; aplicarMarca(); guardarAjustes(); panel(); };
  P.querySelector("#mez").onclick = () => {
    const o = ORIG.marca.colores, combos = [[o.fondo, o.tinta, o.acento, o.resalte], [o.tinta, o.fondo, o.acento, o.resalte], [o.acento, "#FFFFFF", o.tinta, o.resalte],
      [o.fondo, o.acento, o.tinta, o.resalte], [o.tinta, o.fondo, o.resalte, o.acento], [o.suave || o.fondo, o.tinta, o.acento, o.resalte]];
    window.__giro = ((window.__giro || 0) + 1) % combos.length; [col.fondo, col.tinta, col.acento, col.resalte] = combos[window.__giro]; aplicarMarca(); guardarAjustes(); panel();
  };
  P.querySelector("#propio").onclick = () => { const v = document.createElement("div"); v.className = "ver"; v.innerHTML = `<p style="max-width:520px;font-size:17px;line-height:1.5">¿Tienes tu idea de diseño?<br><br>Sube al chat capturas de carruseles que te gusten (de Instagram o Pinterest), o tu propia plantilla, y escribe: <b>usa mi diseño</b>.<br><br>Claude toma la forma de tus referencias y la hace con tus colores, tus letras y tus fotos. Queda guardado para tus próximos carruseles.</p><button class="btn sec">Entendido</button>`; v.querySelector("button").onclick = () => v.remove(); document.body.appendChild(v); };
  P.querySelector("#formas").onclick = () => { DATA.slides.forEach(x => { const n = (FORMAS[x.tipo] || []).length; if (n > 1) x.variante = ((x.variante || 0) + 1) % n; }); guardarAjustes(); pintar(); };
  P.querySelector("#edt").onclick = () => document.body.classList.toggle("editando");
  P.querySelector("#cop").onclick = async () => {
    const t = `Guarda estos ajustes en mi-estilo-carrusel.md:\nEstilo: ${DATA.estilo}\nColores: fondo ${col.fondo}, texto ${col.tinta}, acento ${col.acento}, resalte ${col.resalte}\nLetras: titulares ${le.titulo} · palabra clave ${le.serif} · texto ${le.cuerpo} · a mano ${le.mano}`;
    try { await navigator.clipboard.writeText(t); P.querySelector("#cop").textContent = "✓ Copiado: pégalo en el chat"; } catch (e) { const a = document.createElement("textarea"); a.value = t; a.style.cssText = "width:100%;height:120px;margin-top:8px"; P.appendChild(a); a.select(); }
  };
  P.querySelector("#res").onclick = () => { try { localStorage.removeItem("carrusel-ajustes"); } catch (e) {} Object.assign(DATA, JSON.parse(JSON.stringify(ORIG))); aplicarMarca(); panel(); pintar(); };
}
/* lo que escribe en las slides se guarda, así no se pierde al cambiar estilo o colores */
function leerCampo(el) {
  const h = el.innerHTML.replace(/<span class="k">(.*?)<\/span>/g, "*$1*").replace(/<br\s*\/?>/g, "\n").replace(/<\/div><div>/g, "\n").replace(/<[^>]+>/g, "");
  const d = document.createElement("textarea"); d.innerHTML = h; return d.value;
}
document.getElementById("grid").addEventListener("input", e => {
  const el = e.target.closest("[data-f]"), s = e.target.closest(".slide"); if (!el || !s) return;
  const sl = DATA.slides[+s.dataset.i], path = el.dataset.f.split("."); let o = sl;
  for (let k = 0; k < path.length - 1; k++) o = o[path[k]];
  let v = leerCampo(el); if (el.dataset.lista) v = v.split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  o[path[path.length - 1]] = v; guardarAjustes();
});
ELEM.init({sel: ".slide", W: 1080, H: 1350, lista: () => DATA.slides, guardar: () => guardarAjustes(), pintar: () => pintar()});
aplicarMarca(); panel();

pintar();
/* #s3 en la dirección muestra solo la slide 3 a tamaño real (así Claude saca las imágenes desde Claude Code) */
const solo = location.hash.match(/^#s(\d+)/);
if (solo) { const sl = document.querySelectorAll(".slide")[+solo[1] - 1]; if (sl) { sl.style.transform = "none"; document.body.className = ""; document.body.style.cssText = "margin:0;padding:0;background:none"; document.body.innerHTML = ""; document.body.appendChild(sl); } }
</script></body></html>
