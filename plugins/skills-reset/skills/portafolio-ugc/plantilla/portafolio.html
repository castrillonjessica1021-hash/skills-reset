<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Tu portafolio UGC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Anton&family=Pinyon+Script&family=Mrs+Saint+Delafield&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body.visor{background:#ECE8E2;font-family:'DM Sans',Arial,sans-serif;color:#1b1b1b;padding:24px 16px 80px}
.cab{max-width:1240px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.cab h1{font-size:22px}.cab p{font-size:14px;opacity:.7;max-width:680px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;background:#1b1b1b;color:#fff;text-decoration:none;display:inline-block}
.btn.sec{background:#fff;color:#1b1b1b;border:1px solid #ccc}
.panel,.check{max-width:1240px;margin:0 auto 18px;background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.panel .g{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.panel .g>b,.check>b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.panel select{font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid #ccc;background:#fafafa}
.panel input[type=color]{width:34px;height:30px;border:1px solid #ccc;border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.panel label{display:flex;flex-direction:column;align-items:center;font-size:11px;opacity:.85}
.est{display:flex;gap:8px;flex-wrap:wrap}
.est button{border:2px solid #ddd;background:#fafafa;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.est button.on{border-color:#1b1b1b;background:#fff}
.est i{display:inline-block;width:14px;height:14px;border-radius:50%}
.check{gap:8px 18px;font-size:14px}
.check span.ok{color:#2F7D4F;font-weight:700}.check span.falta{color:#B4332B;font-weight:700}
.grid{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:22px}
.item{background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.marco{width:100%;aspect-ratio:1920/1080;overflow:hidden;border-radius:8px;position:relative}
.marco .pag{transform-origin:0 0;position:absolute;left:0;top:0}
.guia{font-size:13px;line-height:1.45;background:#FFF8E6;border-radius:10px;padding:10px 12px;margin-top:8px}
.guia b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8a6a12;margin-bottom:2px}
.ver{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;padding:20px;color:#fff;text-align:center}
.ver img{max-width:92vw;border-radius:8px;background:#fff}
body.editando .pag [contenteditable]{outline:3px dashed rgba(0,120,255,.55);outline-offset:6px}
body.solo{padding:0;background:#fff}
body.solo .cab,body.solo .check,body.solo .panel,body.solo .guia{display:none}
body.solo .grid{display:block;max-width:none}body.solo .item{padding:0;border-radius:0;box-shadow:none;display:none}
body.solo .item.ver1{display:block}body.solo .marco{width:auto;border-radius:0}

/* ===== la página: horizontal, 1920 x 1080, como una presentación ===== */
.pag{width:1920px;height:1080px;position:relative;overflow:hidden;background:var(--fondo);color:var(--tinta);font-family:var(--f-texto)}
.pag [contenteditable]{outline:none}
.ab{position:absolute}
.foto{position:absolute;background:var(--suave) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.4);font-size:26px;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif}
.vacia{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 22px,transparent 22px 44px)}
.tit{font-family:var(--f-titulo)}.gde{font-family:var(--f-grande)}.fir{font-family:var(--f-firma);font-weight:400}
em{font-style:italic}
.txt{font-size:28px;line-height:1.5}
.n1,.n2{display:block}
/* celulares con los videos */
.vids{display:grid;gap:26px;align-items:start}
.tel{background:#111;border-radius:34px;padding:9px;box-shadow:0 18px 36px rgba(0,0,0,.18)}
.scr{aspect-ratio:9/16;border-radius:26px;background:#2a2a2a center/cover no-repeat;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-size:20px;font-family:'DM Sans',sans-serif}
.scr.vacia{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 18px,transparent 18px 36px)}
.scr:not(.vacia)::after{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.88)}
.scr:not(.vacia)::before{content:"";position:absolute;left:50%;top:50%;margin:-13px 0 0 -7px;border-left:24px solid #1b1b1b;border-top:13px solid transparent;border-bottom:13px solid transparent;z-index:1}
.tl{text-align:center;margin-top:14px;font-size:20px;line-height:1.3}
.tl small{display:block;font-size:15px;letter-spacing:.18em;text-transform:uppercase;opacity:.75;font-weight:700}
.tl span{font-weight:700}
.qr .cod{background:#fff;padding:12px;border-radius:14px;width:184px;height:184px}
.qr .cod img,.qr .cod canvas{width:160px!important;height:160px!important}
.qr .q{font-size:20px;line-height:1.35;margin-top:14px}
.qr .q b{display:block;font-size:16px;word-break:break-all;margin-top:6px;color:var(--acento)}
.cont{display:flex;gap:44px;flex-wrap:wrap;font-size:26px}
.cont b{display:block;font-size:15px;letter-spacing:.22em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
.paq{display:grid;gap:24px}
.paq>div{border-radius:22px;padding:30px 28px;background:var(--tarjeta);color:var(--tinta)}
.paq h4{font-size:30px;margin-bottom:12px}
.paq ul{list-style:none;font-size:21px;line-height:1.6}
.paq .p{font-size:40px;font-weight:800;margin-top:12px}

/* ================= VERTICAL (1240 x 1754): misma información, mismos colores y letras ================= */
.pag.vert{width:1240px;height:1754px;padding:110px 100px}
.vert .eti{font-size:22px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:var(--acento)}
.vert .vt{font-family:var(--f-titulo);font-size:116px;line-height:1;margin-top:16px}
.vert .vt em{color:var(--acento)}
.vert .nom{line-height:.92}
.vert .nom .n1{font-family:var(--f-titulo);color:var(--acento);font-size:150px}
.vert .nom .n2{font-family:var(--f-grande);font-weight:900;font-size:120px;text-transform:uppercase;letter-spacing:-.02em}
.v-rosa .nom .n1,.v-rosa .nom .n2{display:inline;font-family:var(--f-firma);font-size:170px;text-transform:none;font-weight:400;color:var(--tinta)}
.v-ios .nom .n1,.v-ios .nom .n2,.v-ios .vt{font-family:var(--f-grande);font-weight:700;letter-spacing:-.05em;text-transform:lowercase;color:var(--tinta);font-size:150px}
.v-ios .vt{font-size:110px}.v-ios .vt em{font-style:normal;color:var(--tinta)}
.v-editorial .nom .n1,.v-editorial .nom .n2,.v-editorial .vt{font-family:var(--f-grande);text-transform:uppercase;color:var(--tinta);font-weight:400;font-size:150px}
.v-editorial .vt{font-size:130px}.v-editorial .vt em{font-family:var(--f-firma);text-transform:none;color:var(--acento);font-style:normal}
.v-rosa .vt{text-transform:uppercase;letter-spacing:.04em}.v-rosa .vt em{font-family:var(--f-firma);text-transform:none;font-style:normal;color:var(--tinta);letter-spacing:0}
.vert .val{font-size:32px;line-height:1.4;margin-top:20px;font-family:var(--f-titulo);font-style:italic}
.v-ios .val,.v-editorial .val{font-family:var(--f-texto);font-style:normal}
.vert .chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:28px}
.vert .chips span{border:3px solid currentColor;border-radius:999px;padding:10px 26px;font-size:26px;font-weight:700}
.vert .banda{position:absolute;left:0;right:0;bottom:0;height:200px;background:var(--acento);color:#fff;display:flex;justify-content:space-evenly;align-items:center}
.vert .banda b{display:block;font-family:var(--f-grande);font-size:80px;line-height:1;text-align:center}.vert .banda span{font-size:20px}
.vert .pie{position:absolute;left:100px;right:100px;bottom:60px;display:flex;justify-content:space-between;font-size:20px;letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.vert .bn{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:36px}
.vert .bn>div{background:var(--tarjeta);border-radius:24px;padding:30px 26px;font-size:24px;line-height:1.4;box-shadow:0 12px 26px rgba(0,0,0,.06)}
.vert .bn b{display:block;font-family:var(--f-titulo);font-size:36px;color:var(--acento);margin-bottom:8px}
.vert .ls>div{display:flex;gap:26px;align-items:flex-start;padding:24px 0;border-bottom:2px solid rgba(0,0,0,.12);font-size:32px}
.vert .ls b{font-family:var(--f-titulo);font-size:52px;color:var(--acento);min-width:84px;line-height:1}
.vert .ls small{display:block;font-size:23px;opacity:.7;margin-top:6px}
.vert .paq{grid-template-columns:1fr!important;gap:16px}.vert .paq>div{box-shadow:0 12px 26px rgba(0,0,0,.07);display:grid;grid-template-columns:260px 1fr auto;align-items:center;gap:24px;padding:24px 30px}
.vert .paq h4{margin:0}.vert .paq .p{margin:0;color:var(--acento)}
.vert .cita{background:var(--tarjeta);border-radius:24px;padding:36px;margin-top:26px;font-family:var(--f-titulo);font-style:italic;font-size:34px;line-height:1.35}
.vert .cita small{display:block;font-family:var(--f-texto);font-style:normal;font-size:22px;margin-top:14px;opacity:.7}
.vert .mc{display:flex;flex-wrap:wrap;gap:20px;margin-top:36px}
.vert .mc>div{width:170px;height:170px;border-radius:50%;background:var(--tarjeta) center/cover;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:24px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.08);cursor:pointer}
.v-rosa.vert::before{content:"";position:absolute;inset:36px;border:4px solid var(--tinta);border-radius:46px;pointer-events:none;z-index:3}
.v-ios.p-portada{background:var(--acento);color:#fff}.v-ios.p-portada .nom .n1,.v-ios.p-portada .nom .n2{color:#fff}
.v-ios.p-portada .banda{background:rgba(255,255,255,.08)}
.v-editorial.vert .eti{color:var(--tinta)}.v-editorial .chips span{border-width:2px}

/* ================= VINO ================= */
.e-vino .nav{left:120px;top:64px;font-size:19px;letter-spacing:.24em;font-weight:600;display:flex;gap:56px}
.e-vino .nombre{text-align:center;line-height:.86}
.e-vino .nombre .n1{font-family:var(--f-titulo);color:var(--acento);font-size:170px;font-weight:500}
.e-vino .nombre .n2{font-family:var(--f-grande);font-weight:900;font-size:150px;text-transform:uppercase;letter-spacing:-.03em}
.e-vino .sub{font-size:22px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;color:var(--acento)}
.e-vino .boton{display:inline-block;background:var(--acento);color:#fff;border-radius:10px;padding:16px 46px;font-size:26px;font-weight:600}
.e-vino .banda{background:var(--acento);color:#fff;display:flex;justify-content:space-evenly;align-items:center}
.e-vino .cif{text-align:center}.e-vino .cif b{display:block;font-family:var(--f-grande);font-weight:500;font-size:120px;letter-spacing:-.03em;line-height:1}
.e-vino .cif span{font-size:22px;opacity:.9}
.e-vino .pill{border:2px solid currentColor;border-radius:999px;padding:12px 30px;font-size:26px;font-weight:600}
.e-vino .tg{font-family:var(--f-grande);font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9}
.e-vino .ts{font-family:var(--f-titulo);font-style:italic;color:var(--acento);line-height:.9}
.e-vino .ben>div{display:flex;gap:26px;padding:22px 0;border-bottom:2px solid rgba(0,0,0,.1)}
.e-vino .ben b{font-family:var(--f-titulo);font-size:56px;color:var(--acento);line-height:1;min-width:70px}
.e-vino .ben h5{font-size:28px}.e-vino .ben p{font-size:22px;opacity:.75;margin-top:4px}
.e-vino .pillv{display:inline-block;background:var(--acento);color:#fff;border-radius:999px;padding:12px 32px;font-size:26px;font-weight:700}
.e-vino .circ{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-titulo);font-size:30px;padding:16px;background:var(--acento) center/cover;color:#fff;cursor:pointer}
.e-vino .circ:nth-child(3n+2){background-color:var(--suave);color:var(--acento)}.e-vino .circ:nth-child(3n){background-color:var(--tinta)}
.e-vino .cita{font-family:var(--f-titulo);font-style:italic;font-size:36px;line-height:1.35;margin-bottom:34px}
.e-vino .cita small{display:block;font-family:var(--f-texto);font-style:normal;font-size:20px;margin-top:12px;opacity:.8;letter-spacing:.12em;text-transform:uppercase}
.e-vino .paq>div{border:2px solid var(--acento);background:var(--fondo)}
.e-vino .paq h4{color:var(--acento);font-family:var(--f-titulo)}

/* ================= ROSA Y CAFÉ ================= */
.e-rosa{font-family:var(--f-texto)}
.e-rosa .caja{position:absolute;inset:40px;border:4px solid var(--tinta);border-radius:46px;overflow:hidden}
.e-rosa.p-portada,.e-rosa.p-porque,.e-rosa.p-contratar{background:var(--fondo)}
.e-rosa .rayas{background:repeating-linear-gradient(90deg,rgba(0,0,0,.13) 0 28px,transparent 28px 56px),var(--acento)}
.e-rosa .rosa{background:var(--fondo)}.e-rosa .crema{background:var(--suave)}
.e-rosa .caps{font-family:var(--f-grande);text-transform:uppercase;letter-spacing:.04em;font-weight:500;line-height:1}
.e-rosa .scr2{font-family:var(--f-firma);line-height:1;font-weight:400}
.e-rosa .menu{left:0;right:0;top:0;height:76px;display:flex;justify-content:space-evenly;align-items:center;font-family:var(--f-grande);font-size:21px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.55);color:var(--tinta)}
.e-rosa .pillr{background:var(--acento);color:var(--suave);border-radius:999px;padding:16px 34px;font-family:var(--f-grande);font-size:26px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
.e-rosa .lr div{font-family:var(--f-grande);font-size:28px;text-transform:uppercase;letter-spacing:.08em;padding:12px 0}
.e-rosa .lr small{display:block;font-family:var(--f-texto);text-transform:none;letter-spacing:0;font-size:18px;opacity:.75;margin-top:4px}
.e-rosa .tel{border-radius:30px}
.e-rosa .tl small{font-family:var(--f-grande);font-weight:600;letter-spacing:.14em}
.e-rosa .circ{width:200px;height:200px;border-radius:50%;background:#fff center/cover;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-grande);font-size:30px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:18px;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.08)}
.e-rosa .paq>div{background:var(--suave);border:3px solid var(--tinta);border-radius:22px}
.e-rosa .paq h4{font-family:var(--f-grande);text-transform:uppercase;letter-spacing:.06em;text-align:center;border-bottom:2px solid var(--tinta);padding-bottom:12px}
.e-rosa .paq li{border-bottom:2px dotted rgba(0,0,0,.3)}
.e-rosa .paq .p{font-family:var(--f-grande);text-align:center}

/* ================= NOTAS (iPhone) ================= */
.e-ios{font-family:var(--f-texto);letter-spacing:-.01em}
.e-ios .oscuro{background:var(--acento);color:#fff}
.e-ios .gr{font-family:var(--f-grande);font-weight:700;letter-spacing:-.055em;text-transform:lowercase;line-height:.86}
.e-ios .win{background:var(--tarjeta);border-radius:30px;box-shadow:0 24px 50px rgba(0,0,0,.14)}
.e-ios .chip{background:#fff;color:#1b1b1b;border-radius:999px;padding:12px 24px;font-size:20px;font-weight:700;display:inline-flex;gap:8px;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.e-ios .chip.n{background:var(--acento);color:#fff}
.e-ios .marcasF{display:flex;justify-content:space-evenly;align-items:center;font-family:var(--f-firma);font-size:38px;letter-spacing:.06em;text-transform:uppercase}
.e-ios .notas{font-size:22px;color:#D49B00;font-weight:600;display:flex;justify-content:space-between}
.e-ios .tarj{background:var(--acento);color:#fff;border-radius:20px;padding:26px 28px}
.e-ios .tarj h5{font-size:30px;font-weight:700;margin:14px 0 8px}
.e-ios .tarj p{font-size:20px;line-height:1.4;opacity:.72}
.e-ios .dots{display:flex;gap:8px}.e-ios .dots i{width:14px;height:14px;border-radius:50%;background:#FF5F57}.e-ios .dots i:nth-child(2){background:#FEBC2E}.e-ios .dots i:nth-child(3){background:#28C840}
.e-ios .tab{background:var(--suave);border-radius:12px;padding:8px 30px;font-size:30px;font-weight:600}
.e-ios .tel{border-radius:30px;padding:7px}
.e-ios .polar{background:#fff;padding:12px 12px 40px;box-shadow:0 10px 24px rgba(0,0,0,.25);color:#1b1b1b;text-align:center;font-size:20px;font-weight:600;cursor:pointer}
.e-ios .polar div{width:150px;height:150px;background:#ddd center/cover;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.e-ios .bur{background:#E9E9EB;color:#1b1b1b;border-radius:30px 30px 30px 8px;padding:22px 28px;font-size:24px;line-height:1.4;margin-bottom:18px;max-width:760px}
.e-ios .bur small{display:block;font-size:17px;opacity:.6;margin-top:6px}
.e-ios .met{background:#1b1b1b;color:#fff;border-radius:16px;display:flex;gap:40px;padding:18px 30px;width:max-content}
.e-ios .met b{display:block;font-size:44px;font-weight:800}.e-ios .met span{font-size:15px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.e-ios .fila{display:flex;gap:22px;padding:20px 0;border-bottom:1px solid rgba(0,0,0,.1);font-size:24px;align-items:baseline}
.e-ios .fila b{font-size:16px;letter-spacing:.14em;text-transform:uppercase;min-width:60px;opacity:.55}
.e-ios .paq>div{border-radius:22px;box-shadow:0 14px 30px rgba(0,0,0,.1);text-align:center}
.e-ios .paq .rb{display:inline-block;background:var(--acento);color:#fff;border-radius:999px;padding:10px 26px;font-size:18px;font-weight:700;margin-top:14px}

/* ================= EDITORIAL ================= */
.e-editorial{background:radial-gradient(ellipse at 20% 30%,rgba(0,0,0,.035),transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(0,0,0,.04),transparent 55%),var(--fondo)}
.e-editorial .cabe{left:110px;right:110px;top:46px;display:flex;justify-content:space-between;font-family:var(--f-texto);font-weight:800;font-size:19px;letter-spacing:.16em;text-transform:uppercase}
.e-editorial .an{font-family:var(--f-grande);text-transform:uppercase;line-height:.88;letter-spacing:-.005em}
.e-editorial .sc{font-family:var(--f-firma);color:var(--acento);line-height:1;font-weight:400}
.e-editorial .ast{color:var(--acento);font-family:Arial,sans-serif;font-weight:900;line-height:1}
.e-editorial .flecha{right:110px;bottom:60px;width:150px;height:2px;background:var(--tinta)}
.e-editorial .flecha::after{content:"";position:absolute;right:0;top:-7px;width:14px;height:14px;border-top:2px solid var(--tinta);border-right:2px solid var(--tinta);transform:rotate(45deg)}
.e-editorial .mas>div{display:flex;gap:16px;align-items:baseline;font-size:24px;padding:10px 0}
.e-editorial .mas>div::before{content:"✦";color:var(--acento);font-size:22px}
.e-editorial .mas small{display:block;font-size:18px;opacity:.7}

if (window.MEDIA_DEMO) Object.assign(media, window.MEDIA_DEMO);
const guardar = () => { try { localStorage.setItem("ugc-media", JSON.stringify(media)); } catch (e) {} };
